<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>덕형 수학 배틀존</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css" />
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  :root{--paper:#f4efe3;--paperDeep:#ece4d2;--ink:#2a2520;--inkSoft:#6b6357;
    --red:#bd3b2c;--redSoft:#e7c4bd;--green:#3f6b48;--greenSoft:#cadfce;
    --amber:#a9731f;--amberSoft:#ecd9b4;--line:#d8cfb9;--gold:#c9a227;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Newsreader',Georgia,serif;
    background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 30px;background-position:0 70px;min-height:100vh;}
  .wrap{max-width:760px;margin:0 auto;padding:18px 18px 80px;}
  h1{font-family:'Fraunces',serif;font-weight:900;font-size:28px;margin:0;letter-spacing:-.02em}
  h2{font-family:'Fraunces',serif;font-weight:600;font-size:21px;margin:0 0 12px}
  .sub{color:var(--inkSoft);font-style:italic;margin:2px 0 0;font-size:14px}
  header{border-bottom:2px solid var(--ink);background:var(--paper);padding:16px 0 14px;margin-bottom:22px;
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
  label{display:block;font-size:14px;color:var(--inkSoft);margin:0 0 5px}
  input,textarea{width:100%;font-family:inherit;font-size:16px;padding:11px 13px;background:#fff;
    border:1px solid var(--line);border-radius:3px;color:var(--ink)}
  textarea{resize:vertical}
  .field{margin-bottom:16px}
  .btn{font-family:'Fraunces',serif;font-weight:600;font-size:16px;padding:12px 22px;color:var(--paper);
    background:var(--ink);border:none;border-radius:3px;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.block{width:100%}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .card{border:1px solid var(--line);border-radius:5px;padding:18px;background:var(--paper);margin-bottom:14px}
  .big-btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:520px){.big-btns{grid-template-columns:1fr}}
  .pick{padding:30px 18px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .pick:hover{border-color:var(--ink)}
  .pick .t{font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin-top:8px}
  .pick .d{color:var(--inkSoft);font-size:14px;margin-top:4px}
  .code-box{text-align:center;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:18px}
  .code{font-family:'Fraunces',serif;font-weight:900;font-size:52px;letter-spacing:.18em;color:var(--red);line-height:1}
  .qr{display:flex;justify-content:center;margin:14px 0 6px}
  .qr img,.qr canvas{border:6px solid #fff;border-radius:4px}
  .link{font-size:13px;color:var(--inkSoft);word-break:break-all}
  .banner{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--gold);border-radius:6px;padding:14px 16px;margin-bottom:16px}
  .banner .crown{font-size:26px}
  .banner .who{font-family:'Fraunces',serif;font-weight:700;font-size:20px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:4px;background:#fff;margin-bottom:8px;cursor:pointer}
  .row .rank{font-family:'Fraunces',serif;font-weight:900;font-size:18px;width:30px;text-align:center;color:var(--inkSoft)}
  .row.top .rank{color:var(--gold)}
  .row .nm{flex:1;font-size:16px;font-weight:500}
  .row .nm small{color:var(--inkSoft);font-weight:400;margin-left:6px}
  .row .sc{font-family:'Fraunces',serif;font-weight:700;font-size:18px}
  .badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;font-family:'Fraunces',serif}
  .b-correct{background:var(--greenSoft);color:var(--green)}
  .b-incorrect{background:var(--redSoft);color:var(--red)}
  .b-partial{background:var(--amberSoft);color:var(--amber)}
  .b-unclear{background:var(--paperDeep);color:var(--inkSoft)}
  .feat{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .feat:first-child{border-top:none}
  .feat .mk{font-family:'Fraunces',serif;font-weight:900;font-size:16px}
  .feat .ok{color:var(--green)} .feat .no{color:var(--red)}
  .feat .fn{font-size:15px;font-weight:600}
  .feat .fn span{font-weight:400;color:var(--inkSoft)}
  .feat .cm{font-size:14px;color:var(--inkSoft);margin-top:1px}
  .uploadbox{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding:28px 16px;
    background:#fff;border:2px dashed var(--line);border-radius:5px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
  .uploadbox.drag{border-color:var(--ink);background:var(--greenSoft)}
  .preview{width:100%;border-radius:4px;display:block;border:1px solid var(--line)}
  .muted{color:var(--inkSoft);font-size:14px}
  .count{font-family:'Fraunces',serif;font-weight:600;color:var(--inkSoft)}
  .modal{position:fixed;inset:0;background:rgba(20,16,12,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
  .modal .inner{background:var(--paper);border-radius:6px;max-width:600px;width:100%;max-height:90vh;overflow:auto;padding:20px;border:2px solid var(--ink)}
  .toggle{font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer}
  .sol{white-space:pre-wrap;font-family:'Newsreader',serif;font-size:15px;line-height:1.7;background:#fff;border:1px solid var(--line);border-radius:4px;padding:13px;margin:8px 0 0}
  .err{color:var(--red);margin-top:12px}
  .scoreline{display:flex;align-items:baseline;gap:10px;margin:4px 0 12px}
  .scoreline .pts{font-family:'Fraunces',serif;font-weight:900;font-size:40px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--paper);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .mathbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .mathbar button{font-family:'Newsreader',serif;font-size:15px;padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:4px;cursor:pointer;min-width:38px}
  .mathbar button:hover{border-color:var(--ink)}
  .mpreview{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px;min-height:44px;margin-top:8px;overflow-x:auto}
  .mpreview .muted{font-size:13px}
  .cropwrap{max-height:60vh;background:#000;border-radius:4px;overflow:hidden}
  .cropwrap img{max-width:100%;display:block}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  .answer-graph{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px;margin-top:10px}
  .reveal-bar{margin-bottom:14px}
  .reveal-btn{font-family:'Fraunces',serif;font-weight:600;font-size:14px;padding:8px 14px;margin:0 6px 6px 0;
    background:#fff;border:1px solid var(--line);border-radius:4px;cursor:pointer;color:var(--ink)}
  .reveal-btn:hover{border-color:var(--ink)}
  .reveal-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .reveal-btn.csv{border-color:var(--green);color:var(--green)}
  .strength-tag{display:inline-block;background:var(--greenSoft);color:var(--green);font-size:13px;
    padding:4px 10px;border-radius:20px;margin-top:8px;font-family:'Fraunces',serif;font-weight:600}
</style>

<body>
<div class="wrap">
  <header>
    <div><h1>덕형 수학 배틀존</h1><p class="sub">미분으로 그래프를 그려 겨루는 곳</p></div>
    <button class="btn ghost" onclick="goHome()" style="font-size:14px;padding:8px 14px">처음으로</button>
  </header>
  <div id="app"></div>
</div>
<script>
const $=(s)=>document.querySelector(s);
const app=()=>$("#app");
let st={code:null,problem:null,problemImage:null,poll:null,student:null};
const params=new URLSearchParams(location.search);
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function badge(v){const m={correct:["b-correct","정답"],incorrect:["b-incorrect","오답"],partial:["b-partial","부분"],unclear:["b-unclear","판독"]}[v]||["b-unclear","판독"];return '<span class="badge '+m[0]+'">'+m[1]+'</span>';}
function stopPoll(){if(st.poll){clearInterval(st.poll);st.poll=null;}}
function goHome(){stopPoll();history.replaceState({},"",location.pathname);landing();}

// ── 이미지 크롭 (Cropper.js) ──
function cropImage(file){
  return new Promise((resolve)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const m=document.createElement("div");m.className="modal";
      m.innerHTML='<div class="inner"><h2>필요한 부분만 잘라내기</h2><p class="muted" style="margin-top:-6px">드래그로 영역을 조절하세요. 전체를 쓰려면 그대로 두면 됩니다.</p><div class="cropwrap"><img id="cropimg" src="'+rd.result+'"></div><div class="modal-actions"><button class="toggle" id="cropCancel">취소</button><button class="btn" id="cropOk">이 영역 사용</button></div></div>';
      document.body.appendChild(m);
      const imgEl=m.querySelector("#cropimg");
      const cropper=new Cropper(imgEl,{viewMode:1,autoCropArea:1,background:false});
      m.querySelector("#cropCancel").onclick=()=>{cropper.destroy();m.remove();resolve(null);};
      m.querySelector("#cropOk").onclick=()=>{
        const canvas=cropper.getCroppedCanvas({maxWidth:1400,maxHeight:1400});
        const out=canvas.toDataURL("image/jpeg",0.82);
        cropper.destroy();m.remove();resolve(out);
      };
    };
    rd.readAsDataURL(file);
  });
}

// ── 공통 이미지 입력: 파일 선택 + 드래그 끌어오기 + Ctrl+V 붙여넣기 ──
// 한 영역(box)에 세 입력 방식을 붙이고, 크롭을 거쳐 onDone(dataUrl) 호출.
function makeImageInput(opts){
  const box=document.getElementById(opts.boxId);
  const fileInput=document.getElementById(opts.fileId);
  if(!box||!fileInput)return null;
  async function handle(fileOrBlob){
    if(!fileOrBlob)return;
    const out=await cropImage(fileOrBlob);
    if(!out)return;
    opts.onDone(out);
    showPreview(out);
  }
  function showEmpty(){
    box.innerHTML='<div class="uploadbox"><div style="font-size:26px">'+(opts.icon||"📋")+'</div>'+
      '<div style="font-family:\'Fraunces\';font-weight:600;margin-top:6px">'+opts.title+'</div>'+
      '<div class="muted" style="margin-top:2px">여기에 <b>Ctrl+V</b>로 붙여넣거나, 이미지를 <b>끌어다 놓으세요</b></div>'+
      '<button class="toggle filepick" style="margin-top:10px">또는 파일 선택 / 촬영</button>'+
      (opts.hint?'<div class="muted" style="margin-top:6px;font-size:13px">'+opts.hint+'</div>':'')+'</div>';
    const ub=box.querySelector(".uploadbox");
    ub.querySelector(".filepick").onclick=(e)=>{e.stopPropagation();fileInput.click();};
    bindDropPaste(ub);
  }
  function showPreview(dataUrl){
    box.innerHTML='<img class="preview" src="'+dataUrl+'"><button class="toggle" style="margin-top:8px">다시 선택 / 붙여넣기</button>';
    box.querySelector("button").onclick=()=>fileInput.click();
    bindDropPaste(box);
  }
  function bindDropPaste(el){
    // 영역 클릭만으로는 파일창을 열지 않음 (붙여넣기/끌어오기 여유를 줌)
    el.addEventListener("dragover",(e)=>{e.preventDefault();el.classList.add("drag");});
    el.addEventListener("dragleave",()=>el.classList.remove("drag"));
    el.addEventListener("drop",(e)=>{e.preventDefault();el.classList.remove("drag");
      const dt=e.dataTransfer;if(dt&&dt.files&&dt.files.length){
        const f=[...dt.files].find(x=>x.type.startsWith("image/"));if(f)handle(f);}});
    el.addEventListener("mouseenter",()=>{window.__lastFocusTarget=opts.boxId;});
    el.addEventListener("touchstart",()=>{window.__lastFocusTarget=opts.boxId;});
    el.addEventListener("click",()=>{window.__lastFocusTarget=opts.boxId;});
  }
  fileInput.onchange=(e)=>{const f=e.target.files&&e.target.files[0];if(f)handle(f);e.target.value="";};
  showEmpty();
  return {id:opts.boxId,handle,showEmpty,showPreview};
}
// 화면당 붙여넣기 핸들러 하나만 유지. targets: makeImageInput 반환 객체 배열
function setPasteTargets(targets){
  if(window.__activePaste)document.removeEventListener("paste",window.__activePaste);
  targets=(targets||[]).filter(Boolean);
  if(!targets.length){window.__activePaste=null;return;}
  const h=(e)=>{
    const items=(e.clipboardData&&e.clipboardData.items)||[];
    for(const it of items){
      if(it.type&&it.type.startsWith("image/")){
        const blob=it.getAsFile();
        if(blob){e.preventDefault();
          const t=targets.find(x=>x.id===window.__lastFocusTarget)||targets[0];
          t.handle(blob);return;}
      }
    }
  };
  window.__activePaste=h;document.addEventListener("paste",h);
}

// ── 수식 편집기 ──
const MATH_BTNS=[
  ["x²","^{2}"],["xⁿ","^{}"],["√","\\sqrt{}"],["a/b","\\frac{}{}"],
  ["∫","\\int_{}^{} \\,dx"],["∑","\\sum_{}^{}"],["lim","\\lim_{x \\to }"],["∞","\\infty"],
  ["ln","\\ln "],["log","\\log "],["eˣ","e^{}"],["sin","\\sin "],["cos","\\cos "],["tan","\\tan "],
  ["π","\\pi "],["θ","\\theta "],["·","\\cdot "],["( )","()"],
];
function renderMath(tex,el){
  if(!tex.trim()){el.innerHTML='<span class="muted">여기에 수식 미리보기가 표시됩니다.</span>';return;}
  try{katex.render(tex,el,{throwOnError:false,displayMode:true});}
  catch(e){el.innerHTML='<span class="muted">입력 확인 중…</span>';}
}
function insertAtCursor(input,text){
  const s=input.selectionStart,e=input.selectionEnd,v=input.value;
  input.value=v.slice(0,s)+text+v.slice(e);
  const caret=text.indexOf("{}")>=0?s+text.indexOf("{}")+1:s+text.length;
  input.focus();input.setSelectionRange(caret,caret);
}
// 텍스트 안의 $...$ / $$...$$ 를 KaTeX로 렌더링해 안전한 HTML 문자열로 반환.
// 수식 밖 일반 텍스트는 escape 처리하고 줄바꿈은 <br>로.
function mathText(s){
  if(s==null)return"";
  const str=String(s);
  let out="",i=0;
  while(i<str.length){
    // $$...$$ (블록) 먼저
    if(str[i]==="$"&&str[i+1]==="$"){
      const end=str.indexOf("$$",i+2);
      if(end>-1){const tex=str.slice(i+2,end);
        try{out+=katex.renderToString(tex,{throwOnError:false,displayMode:true});}
        catch(e){out+=escNl(str.slice(i,end+2));}
        i=end+2;continue;}
    }
    if(str[i]==="$"){
      const end=str.indexOf("$",i+1);
      if(end>-1){const tex=str.slice(i+1,end);
        try{out+=katex.renderToString(tex,{throwOnError:false,displayMode:false});}
        catch(e){out+=escNl(str.slice(i,end+1));}
        i=end+1;continue;}
    }
    // 다음 $ 까지 일반 텍스트 (현재 위치가 $이지만 짝이 없으면 그 글자만 출력)
    if(str[i]==="$"){out+="$";i++;continue;}
    let next=str.indexOf("$",i);if(next<0)next=str.length;
    out+=escNl(str.slice(i,next));i=next;
  }
  return out;
}
function escNl(t){return t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/\n/g,"<br>");}

// ── 랜딩 ──
function landing(){
  if(window.__activePaste){document.removeEventListener("paste",window.__activePaste);window.__activePaste=null;}
  app().innerHTML='<div class="card"><h2>어떻게 시작할까요?</h2><div class="big-btns">'+
    '<div class="pick" onclick="teacherCreate()"><div class="t">선생님</div><div class="d">문제 내고 실시간 순위 보기</div></div>'+
    '<div class="pick" onclick="studentJoin()"><div class="t">학생</div><div class="d">코드로 참여해 답안 제출</div></div>'+
    '</div></div>';
}

// ── 선생님: 출제 ──
let teacherProblemImg=null, teacherAnswerImg=null;
function teacherCreate(){
  teacherProblemImg=null;teacherAnswerImg=null;
  app().innerHTML=
  '<div class="card"><h2>문제 만들기</h2>'+
  '<div class="field"><label>문제 — 사진 올리기 · 캡처 끌어오기 · Ctrl+V 붙여넣기 모두 됩니다. 올린 뒤 필요한 부분만 잘라낼 수 있어요.</label>'+
    '<input id="pfile" type="file" accept="image/*" style="display:none" />'+
    '<div id="pbox"></div></div>'+
  '<div class="field"><label>문제 글 (선택 — 사진 대신/함께 쓸 수 있어요)</label>'+
    '<textarea id="ptext" rows="2" placeholder="예) y = x ln x 의 그래프 개형을 미분을 이용하여 그리시오."></textarea></div>'+
  '<div class="field"><label>모범답안 — 정답 함수를 수식으로 넣거나, 모범답안 이미지를 올리세요(끌어오기·붙여넣기 가능). <b>비워두면 AI가 스스로 모범답안을 만들어 채점합니다.</b></label>'+
    '<div class="mathbar" id="mathbar"></div>'+
    '<input id="atext" placeholder="예) y = x \\ln x  (정의역 x>0)" oninput="updMath()" />'+
    '<div class="mpreview" id="mprev"></div>'+
    '<input id="afile" type="file" accept="image/*" style="display:none" />'+
    '<div id="abox" style="margin-top:10px"></div></div>'+
  '<button class="btn block" id="startBtn" onclick="createSession()">수업 시작</button>'+
  '<p class="muted" id="cmsg" style="margin-top:10px"></p><div id="cerr"></div></div>';
  const bar=$("#mathbar");
  MATH_BTNS.forEach(([label,tex])=>{const b=document.createElement("button");b.type="button";b.textContent=label;
    b.onclick=()=>{insertAtCursor($("#atext"),tex);updMath();};bar.appendChild(b);});
  updMath();
  const pIn=makeImageInput({boxId:"pbox",fileId:"pfile",title:"문제 이미지 넣기",hint:"교재·학습지 사진, 화면 캡처 모두 가능",icon:"📋",onDone:(d)=>{teacherProblemImg=d;}});
  const aIn=makeImageInput({boxId:"abox",fileId:"afile",title:"모범답안 이미지 넣기 (선택)",hint:"모범답안을 올리면 그 기준으로 채점합니다",icon:"✏️",onDone:(d)=>{teacherAnswerImg=d;}});
  setPasteTargets([pIn,aIn]);
}
function updMath(){renderMath($("#atext").value,$("#mprev"));}
async function createSession(){
  const problemText=$("#ptext").value.trim();
  const answerText=$("#atext").value.trim();
  if(!teacherProblemImg && !problemText){$("#cerr").innerHTML='<p class="err">문제 사진을 올리거나 문제 글을 입력해 주세요.</p>';return;}
  const b=$("#startBtn");b.disabled=true;
  $("#cmsg").textContent="문제와 정답 그래프를 준비하는 중… (잠시 걸려요)";
  try{
    const r=await fetch("/api/sessions",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({problemText,problemImage:teacherProblemImg,answerText,answerImage:teacherAnswerImg})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||"오류");
    st.code=d.code;st.problem=problemText;st.problemImage=teacherProblemImg;teacherDash();
  }catch(e){$("#cerr").innerHTML='<p class="err">'+esc(e.message)+'</p>';b.disabled=false;$("#cmsg").textContent="";}
}

// ── 선생님: 순위판 ──
let revealStage=0; // 0:전부 가림, 1:1등, 2:2등까지, 3:3등까지, 99:전체공개
let lastBoard=[];
function lsKey(k){return "mathbattle_"+st.code+"_"+k;}
function saveLocal(){
  try{
    localStorage.setItem(lsKey("reveal"),String(revealStage));
    localStorage.setItem(lsKey("board"),JSON.stringify(lastBoard));
    localStorage.setItem(lsKey("meta"),JSON.stringify({problem:st.problem,problemImage:st.problemImage}));
  }catch(e){}
}
function teacherDash(){
  if(window.__activePaste){document.removeEventListener("paste",window.__activePaste);window.__activePaste=null;}
  const link=location.origin+"/?s="+st.code;
  // 새로고침 복구
  try{
    const rv=localStorage.getItem(lsKey("reveal"));if(rv!=null)revealStage=parseInt(rv,10)||0;
    const bd=localStorage.getItem(lsKey("board"));if(bd)lastBoard=JSON.parse(bd)||[];
  }catch(e){}
  app().innerHTML=
  '<div class="card"><div class="code-box"><div class="muted">학생 참여 코드</div>'+
  '<div class="code">'+st.code+'</div><div class="qr" id="qr"></div><div class="link">'+esc(link)+'</div>'+
  '<button class="toggle" style="margin-top:8px" onclick="copyLink(\''+esc(link)+'\')">링크 복사</button></div></div>'+
  '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
  '<h2 style="margin:0">실시간 순위</h2><span class="count" id="cnt">0명 제출</span></div>'+
  (st.problemImage?'<img class="preview" src="'+st.problemImage+'" style="margin-bottom:10px">':'')+
  (st.problem?'<div class="muted" style="margin-bottom:14px">'+esc(st.problem)+'</div>':'')+
  '<div class="reveal-bar" id="revealBar"></div>'+
  '<div id="banner"></div><div id="board"><p class="muted">아직 제출이 없어요. 학생들이 코드로 참여하면 실시간으로 표시됩니다.</p></div></div>';
  try{if(window.QRCode)new QRCode($("#qr"),{text:link,width:150,height:150,colorDark:"#2a2520",colorLight:"#ffffff"});}catch(e){}
  renderRevealBar();renderBoard();
  pollBoard();st.poll=setInterval(pollBoard,2500);
}
function renderRevealBar(){
  const bar=$("#revealBar");if(!bar)return;
  const labels=[["1등 공개",1],["2등 공개",2],["3등 공개",3],["전체 공개",99],["다시 가리기",0]];
  bar.innerHTML='<div class="muted" style="font-size:13px;margin-bottom:6px">공개 조절 (이 버튼은 선생님 화면에서만 보입니다. TV에는 공개한 만큼만 나와요.)</div>'+
    labels.map(([t,v])=>'<button class="reveal-btn'+(revealStage===v?' on':'')+'" onclick="setReveal('+v+')">'+t+'</button>').join("")+
    '<button class="reveal-btn csv" onclick="downloadCsv()">CSV 내려받기</button>';
}
function setReveal(v){revealStage=v;saveLocal();renderRevealBar();renderBoard();}
function downloadCsv(){window.open("/api/sessions/"+st.code+"/csv","_blank");}
async function pollBoard(){
  try{const r=await fetch("/api/sessions/"+st.code+"/leaderboard");if(!r.ok)return;const d=await r.json();
    if($("#cnt"))$("#cnt").textContent=d.count+"명 제출";
    lastBoard=d.leaderboard||[];saveLocal();renderBoard();
  }catch(e){}
}
function renderBoard(){
  const lb=lastBoard||[];
  const cntEl=$("#cnt");if(cntEl&&lb.length)cntEl.textContent=lb.length+"명 제출";
  const banner=$("#banner"),board=$("#board");if(!board)return;
  if(!lb.length){banner.innerHTML="";board.innerHTML='<p class="muted">아직 제출이 없어요. 학생들이 코드로 참여하면 실시간으로 표시됩니다.</p>';return;}
  // 몇 명까지 보여줄지
  const showN = revealStage===0?0 : revealStage===99?lb.length : Math.min(revealStage,lb.length);
  if(showN===0){
    banner.innerHTML='<div class="banner" style="border-color:var(--line)"><span class="crown">🤫</span>'+
      '<div style="flex:1"><div class="who" style="font-size:17px">순위 가림 상태</div>'+
      '<div class="muted" style="font-size:13px">'+lb.length+'명 제출 완료 · 공개 버튼을 누르면 등수가 나타납니다</div></div></div>';
    board.innerHTML='<p class="muted">제출은 계속 받고 있어요. 준비되면 위에서 1등부터 공개해 보세요.</p>';
    return;
  }
  const top=lb[0];
  banner.innerHTML='<div class="banner"><span class="crown">👑</span><div style="flex:1">'+
    '<div class="muted" style="font-size:13px">1위</div><div class="who">'+esc(top.name)+' <small style="color:var(--inkSoft);font-weight:400">'+esc(top.studentId)+'</small></div>'+
    (top.strength?'<div class="muted" style="font-size:13px;margin-top:2px">잘한 점: '+mathText(top.strength)+'</div>':'')+'</div>'+
    '<div class="sc" style="font-size:24px;color:var(--gold);font-family:\'Fraunces\'">'+top.score+'점</div></div>';
  board.innerHTML=lb.slice(0,showN).map((x,i)=>'<div class="row '+(i===0?'top':'')+'" onclick="openDetail(\''+esc(x.studentId)+'\')">'+
    '<div class="rank">'+(i+1)+'</div><div class="nm">'+esc(x.name)+'<small>'+esc(x.studentId)+'</small>'+
    (x.strength?'<div class="muted" style="font-size:12px;font-weight:400;margin-top:2px">'+mathText(x.strength)+'</div>':'')+
    '</div>'+badge(x.verdict)+'<div class="sc">'+x.score+'점</div></div>').join("")+
    (showN<lb.length?'<p class="muted" style="text-align:center;margin-top:8px">··· 그 외 '+(lb.length-showN)+'명 (가려짐)</p>':'');
}
async function openDetail(sid){
  try{const r=await fetch("/api/sessions/"+st.code+"/submission/"+encodeURIComponent(sid));const x=await r.json();if(!r.ok)throw new Error(x.error||"오류");
    const feats=(x.features||[]).map(f=>'<div class="feat"><span class="mk '+(f.ok?'ok':'no')+'">'+(f.ok?'○':'✕')+'</span><div><div class="fn">'+mathText(f.name)+(f.expected?' <span>— '+mathText(f.expected)+'</span>':'')+'</div>'+(f.comment?'<div class="cm">'+mathText(f.comment)+'</div>':'')+'</div></div>').join("");
    const m=document.createElement("div");m.className="modal";m.onclick=(e)=>{if(e.target===m)m.remove();};
    m.innerHTML='<div class="inner"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+
      '<h2 style="margin:0">'+esc(x.name)+' <small style="color:var(--inkSoft);font-size:15px">'+esc(x.studentId)+'</small></h2>'+
      '<button class="toggle" onclick="this.closest(\'.modal\').remove()">닫기</button></div>'+
      '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px">'+badge(x.verdict)+'<span class="sc" style="font-family:\'Fraunces\';font-weight:900;font-size:26px">'+x.score+'점</span><span class="muted">'+x.okCount+'/'+x.total+' 항목</span></div>'+
      (x.summary?'<p style="margin:0 0 12px">'+mathText(x.summary)+'</p>':'')+
      '<img class="preview" src="'+esc(x.image)+'" style="margin-bottom:12px">'+feats+
      answerGraphHTML(x.answerGraph)+'</div>';
    document.body.appendChild(m);drawAnswerGraph(x.answerGraph);
  }catch(e){alert(e.message);}
}
function copyLink(l){navigator.clipboard&&navigator.clipboard.writeText(l);}

// ── 학생 ──
function studentJoin(code){
  const pre=code||params.get("s")||"";
  app().innerHTML='<div class="card"><h2>수업 참여</h2><div class="field"><label>참여 코드</label>'+
    '<input id="jcode" value="'+esc(pre.toUpperCase())+'" maxlength="4" style="text-transform:uppercase;letter-spacing:.2em;font-family:\'Fraunces\';font-weight:700" placeholder="ABCD" /></div>'+
    '<button class="btn block" onclick="enterSession()">입장</button><div id="jerr"></div></div>';
  if(pre)enterSession();
}
async function enterSession(){
  const code=(($("#jcode")&&$("#jcode").value)||params.get("s")||"").trim().toUpperCase();
  if(code.length<4){if($("#jerr"))$("#jerr").innerHTML='<p class="err">4자리 코드를 입력해 주세요.</p>';return;}
  try{const r=await fetch("/api/sessions/"+code);const d=await r.json();if(!r.ok)throw new Error(d.error||"오류");
    st.code=code;st.problem=d.problemText;st.problemImage=d.problemImage;studentSolve();
  }catch(e){if($("#jerr"))$("#jerr").innerHTML='<p class="err">'+esc(e.message)+'</p>';}
}
let studentImg=null;
function studentSolve(){
  studentImg=null;
  app().innerHTML=
  '<div class="card"><h2>문제</h2>'+
  (st.problemImage?'<img class="preview" src="'+st.problemImage+'" style="margin-bottom:8px">':'')+
  (st.problem?'<p style="font-size:17px;line-height:1.5;margin:0">'+esc(st.problem)+'</p>':'')+'</div>'+
  '<div class="card"><div class="field" style="display:flex;gap:10px">'+
  '<div style="flex:1"><label>학번</label><input id="sid" inputmode="numeric" placeholder="10130" /></div>'+
  '<div style="flex:1.4"><label>이름</label><input id="sname" placeholder="홍길동" /></div></div>'+
  '<label>답안 — 사진 촬영·올리기, 태블릿 화면 끌어오기, Ctrl+V 붙여넣기 모두 됩니다. 올린 뒤 필요한 부분만 잘라낼 수 있어요.</label>'+
  '<input id="file" type="file" accept="image/*" capture="environment" style="display:none" />'+
  '<div id="sbox"></div>'+
  '<button class="btn block" id="subBtn" style="margin-top:16px" onclick="submitSolve()">채점받기</button><div id="serr"></div></div>';
  const sIn=makeImageInput({boxId:"sbox",fileId:"file",title:"답안 이미지 넣기",hint:"그래프 문제면 축과 눈금이 보이게",icon:"📋",onDone:(d)=>{studentImg=d;}});
  setPasteTargets([sIn]);
}
async function submitSolve(){
  const studentId=$("#sid").value.trim(),name=$("#sname").value.trim();
  if(!studentId||!name){$("#serr").innerHTML='<p class="err">학번과 이름을 입력해 주세요.</p>';return;}
  if(!studentImg){$("#serr").innerHTML='<p class="err">답안 사진을 올려 주세요.</p>';return;}
  st.student={studentId,name};
  const b=$("#subBtn");b.disabled=true;b.innerHTML='<span class="spin"></span>채점하는 중…';$("#serr").innerHTML="";
  try{const r=await fetch("/api/sessions/"+st.code+"/submit",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({studentId,name,image:studentImg})});const d=await r.json();if(!r.ok)throw new Error(d.error||"오류");
    studentResult(d);
  }catch(e){$("#serr").innerHTML='<p class="err">'+esc(e.message)+'</p>';b.disabled=false;b.textContent="채점받기";}
}
function studentResult(d){
  const feats=(d.features||[]).map(f=>'<div class="feat"><span class="mk '+(f.ok?'ok':'no')+'">'+(f.ok?'○':'✕')+'</span><div><div class="fn">'+mathText(f.name)+(f.expected?' <span>— '+mathText(f.expected)+'</span>':'')+'</div>'+(f.comment?'<div class="cm">'+mathText(f.comment)+'</div>':'')+'</div></div>').join("");
  app().innerHTML='<div class="card"><h2 style="margin-bottom:6px">'+esc(st.student.name)+' 학생의 채점 결과</h2>'+
    '<div class="scoreline">'+badge(d.verdict)+'<span class="pts">'+d.score+'점</span><span class="muted">'+d.okCount+'/'+d.total+' 항목 정답</span></div>'+
    (d.summary?'<p style="font-size:16px;line-height:1.55;margin:0 0 14px">'+mathText(d.summary)+'</p>':'')+
    (d.strength?'<div class="strength-tag">잘한 점: '+mathText(d.strength)+'</div>':'')+
    '<h2 style="font-size:17px;margin-top:14px">'+(d.type==="calc"?"채점 항목":"특징별 채점")+'</h2><div style="border:1px solid var(--line);border-radius:4px;padding:0 13px">'+feats+'</div>'+
    answerGraphHTML(d.answerGraph)+
    (d.correctSolution?'<button class="toggle" style="margin-top:14px" onclick="toggleSol(this)">정답 풀이 보기</button><div class="sol" id="sol" style="display:none">'+mathText(d.correctSolution)+'</div>':'')+
    '<button class="btn block ghost" style="margin-top:16px" onclick="studentSolve()">다시 풀어서 제출하기</button></div>';
  drawAnswerGraph(d.answerGraph);
}
function toggleSol(b){const el=$("#sol");const on=el.style.display==="none";el.style.display=on?"block":"none";b.textContent=on?"정답 풀이 닫기":"정답 풀이 보기";}

// ── 정답 그래프 그리기 ──
function answerGraphHTML(g){
  if(!g)return"";
  if(!g.drawable)return'<div class="answer-graph"><div class="muted">정답 그래프: '+esc(g.note||"이 문제는 그래프로 표시하지 않아요.")+'</div></div>';
  return'<div class="answer-graph"><div style="font-family:\'Fraunces\';font-weight:600;margin-bottom:4px">정답 그래프'+(g.funcLabel?' · '+esc(g.funcLabel):'')+'</div>'+
    (g.domainNote?'<div class="muted" style="margin-bottom:6px">정의역: '+esc(g.domainNote)+'</div>':'')+
    '<canvas class="answer-canvas" width="640" height="420" style="width:100%;height:auto"></canvas>'+
    (g.note?'<div class="muted" style="margin-top:6px">'+esc(g.note)+'</div>':'')+'</div>';
}
function drawAnswerGraph(g){
  if(!g||!g.drawable)return;
  const cv=document.querySelector(".answer-canvas:last-of-type")||document.querySelector(".answer-canvas");
  if(!cv)return;const ctx=cv.getContext("2d");const W=cv.width,H=cv.height,pad=34;
  const pts=g.points.filter(p=>isFinite(p.x)&&isFinite(p.y));if(pts.length<2)return;
  let xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  let xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs),ymin=Math.min.apply(null,ys),ymax=Math.max.apply(null,ys);
  (g.keyPoints||[]).forEach(k=>{xmin=Math.min(xmin,k.x);xmax=Math.max(xmax,k.x);ymin=Math.min(ymin,k.y);ymax=Math.max(ymax,k.y);});
  const xr=(xmax-xmin)||1,yr=(ymax-ymin)||1;xmin-=xr*0.08;xmax+=xr*0.08;ymin-=yr*0.12;ymax+=yr*0.12;
  const X=x=>pad+(x-xmin)/(xmax-xmin)*(W-2*pad);
  const Y=y=>H-pad-(y-ymin)/(ymax-ymin)*(H-2*pad);
  ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#e7dfce";ctx.lineWidth=1;ctx.fillStyle="#9a917f";ctx.font="12px serif";
  for(let i=0;i<=8;i++){const gx=pad+i/8*(W-2*pad);ctx.beginPath();ctx.moveTo(gx,pad);ctx.lineTo(gx,H-pad);ctx.stroke();
    const gy=pad+i/8*(H-2*pad);ctx.beginPath();ctx.moveTo(pad,gy);ctx.lineTo(W-pad,gy);ctx.stroke();}
  ctx.strokeStyle="#9a917f";ctx.lineWidth=1.4;
  if(xmin<0&&xmax>0){ctx.beginPath();ctx.moveTo(X(0),pad);ctx.lineTo(X(0),H-pad);ctx.stroke();}
  if(ymin<0&&ymax>0){ctx.beginPath();ctx.moveTo(pad,Y(0));ctx.lineTo(W-pad,Y(0));ctx.stroke();}
  ctx.strokeStyle="#185FA5";ctx.lineWidth=2.5;ctx.beginPath();
  pts.forEach((p,i)=>{const px=X(p.x),py=Y(p.y);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);});ctx.stroke();
  (g.keyPoints||[]).forEach(k=>{ctx.fillStyle="#bd3b2c";ctx.beginPath();ctx.arc(X(k.x),Y(k.y),4,0,7);ctx.fill();
    if(k.label){ctx.fillStyle="#2a2520";ctx.font="13px serif";ctx.fillText(k.label,X(k.x)+7,Y(k.y)-7);}});
}

if(params.get("s"))studentJoin();else landing();
</script>
